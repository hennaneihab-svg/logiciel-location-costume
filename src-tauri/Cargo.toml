[package]
name = "costume-rental"
version = "0.1.0"
description = "Logiciel de gestion pour location de costumes et chaussures d'événement"
authors = ["Atelier Prestige"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "costume_rental_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-notification = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
