name: Build & Verify Atelier Prestige

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-verify:
    name: Build Tauri & Verify DB Lifecycle (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Frontend (TypeScript & Vite)
        run: npm run build

      - name: Cargo Check (src-tauri)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run DB Lifecycle & Persistence Tests (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test db_lifecycle_test -- --nocapture

      - name: Run Pack Concurrency Test (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test pack_concurrency_test -- --nocapture

      - name: Run Rental SQLite & Migration 0006 FK Restrict Tests (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test rental_sqlite_test -- --nocapture

      - name: Run Caisse SQLite Tests (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test caisse_sqlite_test -- --nocapture

      - name: Run Pressing SQLite Tests (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test pressing_sqlite_test -- --nocapture

      - name: Run Settings & Import SQLite Tests (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test settings_and_import_sqlite_test -- --nocapture

      - name: Run Availability Matrix SQLite Tests (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test availability_matrix_test -- --nocapture

      - name: Build Tauri Binary & Bundle
        run: npm run tauri build

      - name: Verify Compiled Executable Exists
        shell: pwsh
        run: |
          $exePath = "src-tauri\target\release\costume-rental.exe"
          if (Test-Path $exePath) {
            $item = Get-Item $exePath
            Write-Host "SUCCESS: $exePath found! Size: $($item.Length) bytes"
          } else {
            Write-Error "FAILURE: $exePath was not found after tauri build!"
            exit 1
          }

      - name: Upload Application Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atelier-prestige-windows-x64
          path: |
            src-tauri/target/release/costume-rental.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
